<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Design Token Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <h2>App Brand</h2>
    </aside>

    <header class="navbar">
      <h1>Dashboard Overview</h1>
      <button onclick="document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark')">
        Toggle Theme
      </button>
    </header>

    <main class="dashboard-main">
      <section class="dashboard-grid">
        <div class="card">Metric 1</div>
        <div class="card">Metric 2</div>
        <div class="card">Metric 3</div>
        <div class="card card--wide">Analytics Graph</div>
        <div class="card card--full">Recent Activity Table</div>
      </section>
    </main>
  </div>
</body>
</html>
