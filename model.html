<!-- modal.html -->
<div role="dialog" aria-labelledby="modalTitle" aria-describedby="modalDesc" aria-hidden="true" class="modal">
  <header class="modal-header">
    <h2 id="modalTitle">Confirm Action</h2>
  </header>
  <section class="modal-body">
    <p id="modalDesc">Are you sure you want to proceed with this action?</p>
  </section>
  <footer class="modal-footer">
    <button type="button" class="btn-confirm">Yes</button>
    <button type="button" class="btn-cancel">No</button>
  </footer>
</div>
